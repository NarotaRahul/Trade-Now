<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Trade Now</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #e9ecef; }
    .signup-container {
      max-width: 450px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    .form-control, .btn { border-radius: 0; }
    .navbar-brand { font-weight: bold; }
  </style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/frontend/index.html">Trade Now</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/frontend/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/frontend/about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/frontend/contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link active" href="/frontend/signup.html">Sign Up</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="signup-container">
  <h2 class="text-center mb-4">Create an Account</h2>
  <form id="signupForm" onsubmit="return validateForm()">
    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" placeholder="Enter your name">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Create a password">
    </div>
    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password">
    </div>
    <button type="submit" class="btn btn-success w-100">Sign Up</button>
    <p class="mt-3 text-center">Already have an account? <a href="/frontend/login.html">Login here</a></p>
  </form>
</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
  &copy; 2025 Trade Now. All rights reserved.
</footer>

<script>
  function validateForm() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if (name === "") {
      alert("Please enter your full name.");
      return false;
    }

    if (email === "" || !emailPattern.test(email)) {
      alert("Please enter a valid email address.");
      return false;
    }

    if (password.length < 6) {
      alert("Password must be at least 6 characters long.");
      return false;
    }

    if (password !== confirmPassword) {
      alert("Passwords do not match.");
      return false;
    }

    return true; // Allow form to submit
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
