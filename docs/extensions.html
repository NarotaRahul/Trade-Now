<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Extensions - HFT8</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .error-message {
      color: red;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-3">Extensions</h1>
    <p class="mb-4">Integrate 3rd-party tools and apps into your HFT8 platform. Fill in the required information to connect an external service.</p>

    <form id="extensionForm" novalidate>
      <div class="mb-3">
        <label for="toolName" class="form-label">Tool Name</label>
        <input type="text" class="form-control" id="toolName" required />
        <div class="error-message" id="toolNameError"></div>
      </div>

      <div class="mb-3">
        <label for="toolType" class="form-label">Tool Type</label>
        <select class="form-select" id="toolType" required>
          <option value="">Select Tool Type</option>
          <option value="Analytics">Analytics</option>
          <option value="Trading Bot">Trading Bot</option>
          <option value="Alert System">Alert System</option>
          <option value="News Feed">News Feed</option>
        </select>
        <div class="error-message" id="toolTypeError"></div>
      </div>

      <div class="mb-3">
        <label for="toolURL" class="form-label">Tool URL</label>
        <input type="url" class="form-control" id="toolURL" placeholder="https://example.com" required />
        <div class="error-message" id="toolURLError"></div>
      </div>

      <div class="mb-3">
        <label for="toolDesc" class="form-label">Description</label>
        <textarea class="form-control" id="toolDesc" rows="3" required></textarea>
        <div class="error-message" id="toolDescError"></div>
      </div>

      <button type="submit" class="btn btn-primary">Add Extension</button>
    </form>

    <div id="successMessage" class="alert alert-success mt-4 d-none">
      Extension added successfully!
    </div>
  </div>

  <script>
    const form = document.getElementById('extensionForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      
      let valid = true;

      // Clear previous errors
      document.querySelectorAll('.error-message').forEach(el => el.textContent = '');

      const toolName = document.getElementById('toolName');
      const toolType = document.getElementById('toolType');
      const toolURL = document.getElementById('toolURL');
      const toolDesc = document.getElementById('toolDesc');

      // Tool Name Validation
      if (toolName.value.trim() === '') {
        document.getElementById('toolNameError').textContent = 'Tool Name is required.';
        valid = false;
      }

      // Tool Type Validation
      if (toolType.value === '') {
        document.getElementById('toolTypeError').textContent = 'Please select a Tool Type.';
        valid = false;
      }

      // Tool URL Validation
      const urlPattern = /^(https?:\/\/)[^\s$.?#].[^\s]*$/;
      if (!urlPattern.test(toolURL.value)) {
        document.getElementById('toolURLError').textContent = 'Enter a valid URL starting with http:// or https://';
        valid = false;
      }

      // Description Validation
      if (toolDesc.value.trim().length < 10) {
        document.getElementById('toolDescError').textContent = 'Description must be at least 10 characters.';
        valid = false;
      }

      // Show success message if valid
      if (valid) {
        successMessage.classList.remove('d-none');
        form.reset();
      } else {
        successMessage.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
